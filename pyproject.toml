[project]
name = "trading-platform"
version = "0.1.0"
description = "Deterministic Algorithmic Trading Platform"
authors = [
    {name = "Opencode", email = "opencode@example.com"}
]
requires-python = ">=3.11"
# Pinned versions: requirements.txt
dependencies = [
    "flask",
    "duckdb",
    "pandas",
    "numpy",
    "requests",
    "pytz",
    "tzdata",
    "python-dotenv",
    "websockets",
    "protobuf",
    "pyzmq",
    "scikit-learn",
    "scipy",
    "lightgbm"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
